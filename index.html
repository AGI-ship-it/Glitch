<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glitch Sports — Book a court in Deira</title>
    <meta
      name="description"
      content="Book basketball and volleyball courts at Glitch Sports, Al Ghurair Centre, Deira. Pick a slot, pay online, show your QR code at reception."
    />
    <!-- The slider's first slide is the largest thing in the first fold; without this
         it waits for the bundle to parse before the browser learns it exists. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/offers/cutout-players-1100.webp"
      imagesrcset="/offers/cutout-players-700.webp 700w, /offers/cutout-players-1100.webp 1100w"
      imagesizes="(min-width: 768px) 55vw, 92vw"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gantari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
